<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a5230">
<title>商品紀錄</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
:root{
  /* 淺大地色＋金：招財 */
  --bg:#f5eee2; --card:#fffaf2; --card2:#fbf4e8;
  --ink:#3a2d22; --ink2:#6b5847; --muted:#9a8875; --line:#e7dac5; --line2:#d9c7aa;
  --walnut:#7a5230; --walnut2:#93653b; --gold:#c4953f; --gold-soft:#f1e2bf; --gold-ink:#8a621d;
  --row1:#f1e6d3; --row2:#f8f1e5;
  --good:#2b7a57; --bad:#b4472e;
  --series-1:#a8741f; /* 成本：金銅 */
  --series-2:#1f8a68; /* 賣出：翡翠 */
  --radius:12px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px}
body{background-image:radial-gradient(circle at 12% -10%,#fbf3e3 0,transparent 45%),radial-gradient(circle at 100% 0,#f3e4c8 0,transparent 35%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-ink)}
.hidden{display:none!important}

/* 頂部 */
header.top{background:linear-gradient(135deg,var(--walnut),var(--walnut2));color:#fff6e6;box-shadow:0 2px 10px rgba(80,50,20,.18)}
header.top .in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
header.top .brand{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.08em}
header.top .tag{font-size:12px;color:#f1d9a8;letter-spacing:.3em;margin-left:2px}
header.top .sp{flex:1}
header.top .btn{background:rgba(255,246,230,.12);border-color:rgba(255,246,230,.35);color:#fff6e6}
.coin{width:34px;height:34px;flex:none}

main{max-width:1200px;margin:0 auto;padding:18px 14px 100px}
h1{font-family:var(--serif);font-size:21px;margin:2px 0 14px;letter-spacing:.04em}
h2{font-family:var(--serif);font-size:18px;margin:26px 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--gold)}
.sub{color:var(--muted);font-size:13px}

/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;
  background:rgba(255,250,242,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs a{flex:0 1 170px;text-align:center;padding:10px 4px;text-decoration:none;color:var(--ink2);border-radius:10px;font-weight:600}
nav.tabs a.on{background:var(--walnut);color:#fff6e6}
nav.tabs a.new{border:1.5px solid var(--gold);color:var(--gold-ink)}
nav.tabs a.new.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* 工具列、摘要 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--card)}
.toolbar input[type=search]{flex:1 1 220px}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;min-width:140px;box-shadow:0 1px 0 rgba(120,80,30,.05)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tile.gold{background:linear-gradient(135deg,#fff6df,#f6e3b8);border-color:#e8cf95}
.tile.gold .k{color:var(--gold-ink)}
@media(max-width:600px){.summary{gap:6px}.tile{min-width:0;flex:1 1 30%;padding:8px 10px}.tile .v{font-size:16px}}

/* 主表格 */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px;overflow:hidden}
table.ledger{border-collapse:separate;border-spacing:0 3px;min-width:1060px;width:100%}
.ledger th{background:var(--walnut);color:#fff3dd;text-align:left;vertical-align:bottom;padding:9px 7px;font-weight:600;font-size:13.5px;line-height:1.3;white-space:nowrap}
.ledger th:first-child{border-radius:9px 0 0 9px} .ledger th:last-child{border-radius:0 9px 9px 0}
.ledger td{padding:7px 7px;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:middle}
.ledger tbody tr:nth-child(odd) td{background:var(--row1)}
.ledger tbody tr:nth-child(even) td{background:var(--row2)}
.ledger tbody td:first-child{border-radius:9px 0 0 9px} .ledger tbody td:last-child{border-radius:0 9px 9px 0}
.ledger tbody tr{cursor:pointer}
.ledger tbody tr:hover td{background:#efdfc2}
.ledger td.num{text-align:right}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;display:block;background:#fff;border:1px solid var(--line)}
.thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.title-cell{max-width:200px;white-space:normal;line-height:1.35}
.title-cell .t{font-weight:600}
.title-cell .meta{font-size:12px;color:var(--ink2)}
.plat{color:var(--walnut);font-weight:700}
.unset{color:#b4472e;font-weight:600}
.chk{display:flex;align-items:center;gap:6px;padding:9px 0;color:var(--ink);font-size:14px}
.chk input,label.f .chk input{width:18px;height:18px;flex:none;padding:0;accent-color:var(--good)}
.settlebox{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:10px}
.plain td.ck,.plain th.ck{text-align:center;width:36px}
.plain td.ck input{width:18px;height:18px;accent-color:var(--good)}
.diag{background:#fde9e3;border:1px solid #eab3a3;color:#7a2a17;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:14px;line-height:1.6}
.diag code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
.ship{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;border:1px solid}
.ship.move{background:#fbf0d9;color:#8a621d;border-color:#e6c98a}
.ship.arr{background:#e3f1e9;color:#1f6b4a;border-color:#a9d3bb}
.ship.none{background:#f3ece1;color:var(--muted);border-color:var(--line)}
select.shipsel{font-size:12px;padding:3px 2px;border:1px solid var(--line2);border-radius:7px;background:#fff;margin-top:4px;width:84px}
.shipbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.shipbar button{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.shipbar button b{font-variant-numeric:tabular-nums;margin-left:4px;color:var(--gold-ink)}
.shipbar button.on{background:var(--walnut);border-color:var(--walnut);color:#fff6e6}
.shipbar button.on b{color:#f1d9a8}
.shippick{display:flex;flex-wrap:wrap;gap:6px}
.shippick label{cursor:pointer}
.shippick input{position:absolute;opacity:0;pointer-events:none}
.shippick span{display:inline-block;border:1px solid var(--line2);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;color:var(--ink)}
.shippick input:checked + span{background:var(--walnut);border-color:var(--walnut);color:#fff6e6;font-weight:700}
.shippick input:focus-visible + span{outline:2px solid var(--gold)}
.chip{display:inline-block;background:var(--gold-soft);color:var(--gold-ink);border-radius:99px;padding:1px 9px;font-size:12px;margin:3px 3px 0 0}
.unitbtn{border:1px solid var(--gold);background:#fffaf0;color:var(--gold-ink);border-radius:99px;padding:4px 11px;cursor:pointer;font-weight:600}
.unitbtn:hover{background:var(--gold);color:#fff}
.minis{display:flex;margin-top:4px}
.minis img{width:22px;height:22px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-right:-6px;background:#fff}
.pos{color:var(--good)} .neg{color:var(--bad)}
.est{display:block;font-size:11px;color:var(--ink2)}
.empty-state{padding:44px 10px;text-align:center;color:var(--muted)}

/* 表單 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card > .cap{font-family:var(--serif);font-weight:700;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
label.f input,label.f select,label.f textarea{padding:9px 10px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--ink);font-size:15px;min-width:0;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus,.toolbar input:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
label.f textarea{min-height:60px;resize:vertical}
.wide{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:9px 15px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--walnut);border-color:var(--walnut);color:#fff6e6;font-weight:700}
.btn.primary:hover{background:var(--walnut2)}
.btn.goldbtn{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.btn.danger{color:var(--bad);border-color:#e7bcb0}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.imgbox{border:2px dashed var(--line2);border-radius:var(--radius);min-height:160px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;padding:10px;text-align:center;color:var(--muted);cursor:pointer;background:var(--card2)}
.imgbox img{max-width:100%;max-height:340px;border-radius:8px}
.imgbox.drag,.uimg.drag{border-color:var(--gold);background:#fbefd6}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:14px}
.calc > div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.calc > div.hl{background:linear-gradient(135deg,#fff6df,#f6e3b8);border-color:#e8cf95}
.calc .k{font-size:12px;color:var(--muted)} .calc .v{font-weight:700;font-variant-numeric:tabular-nums}
.tags-input{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--line2);border-radius:9px;padding:5px 6px;background:#fff}
label.f .tags-input input{border:0;outline:0;flex:1 1 100px;padding:4px;min-width:80px;width:auto;background:none}
.tags-input .chip{cursor:pointer}
.tags-input .chip::after{content:" ×"}

/* 每一隻：卡片 */
.ulist{display:flex;flex-direction:column;gap:10px}
.ucard{display:grid;grid-template-columns:120px 1fr auto;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.ucard.sold{border-left:4px solid var(--good)} .ucard.reserved{border-left:4px solid var(--gold)}
.uimg{width:120px;height:120px;border:2px dashed var(--line2);border-radius:10px;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);font-size:12px;cursor:pointer;background:#fff;overflow:hidden;position:relative}
.uimg:focus{outline:2px solid var(--gold)}
.uimg img{width:100%;height:100%;object-fit:cover}
.uimg.has{border-style:solid}
.uimgbtns{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;width:120px}
.uimgbtns button{flex:1;font-size:11.5px;padding:4px 2px;border:1px solid var(--line2);background:#fff;border-radius:7px;cursor:pointer;white-space:nowrap}
.ufields{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px 10px;align-content:start}
.ufields .name{grid-column:span 2}
.ufields .sec{grid-column:1/-1;font-size:12px;color:var(--gold-ink);font-weight:700;border-top:1px dashed var(--line2);padding-top:6px;margin-top:2px}
.ufields .alloc{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.ufields .alloc b{padding:9px 0;font-variant-numeric:tabular-nums;color:var(--ink)}
.ufields .alloc small{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px;align-self:start}
.x:hover{color:var(--bad)}
@media(max-width:620px){
  .ucard{grid-template-columns:88px 1fr;position:relative}
  .uimg{width:88px;height:88px} .uimgbtns{width:88px}
  .ucard .x{position:absolute;top:4px;right:4px}
  .ufields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

/* 小視窗 */
.modal-bg{position:fixed;inset:0;background:rgba(50,32,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--card);width:min(960px,100%);max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.modal .mh{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.modal .mh img{width:88px;height:88px;object-fit:cover;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)}
.modal .mh .grow{flex:1}
.modal .mh .mt{font-family:var(--serif);font-size:17px;font-weight:700}
.mfoot{position:sticky;bottom:-16px;background:var(--card);padding:12px 0 2px;margin-top:10px;border-top:1px solid var(--line)}

/* 裁切 */
.cropbg{position:fixed;inset:0;background:rgba(30,20,10,.82);z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.cropwrap{position:relative;overflow:hidden;touch-action:none;user-select:none;max-width:96vw;max-height:78vh}
.cropwrap img{display:block;max-width:96vw;max-height:78vh}
.cropsel{position:absolute;border:2px solid #ffd77a;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.crophint{color:#f5e6c8;font-size:14px}

/* 統計 */
.viz{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:relative}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:#3a2d22;color:#fff6e6;font-size:12px;border-radius:8px;padding:7px 10px;
  white-space:nowrap;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums;z-index:5;line-height:1.5}
table.plain{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.plain th,.plain td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.plain th:first-child,.plain td:first-child{text-align:left}
.plain th{font-size:12px;color:var(--muted);font-weight:600}
.plain tr.click{cursor:pointer} .plain tr.click:hover td{background:var(--row1)}
.bar{height:8px;border-radius:0 4px 4px 0;background:var(--series-1);min-width:2px}
.bar.jade{background:var(--series-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px} @media(max-width:760px){.two{grid-template-columns:1fr}}
.two h3{font-size:14px;margin:0 0 6px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--walnut);color:#fff6e6}
.banner{background:#fff4d8;border:1px solid #ecd391;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff6e6;padding:9px 18px;border-radius:99px;z-index:99;font-size:14px}
.login{max-width:360px;margin:10vh auto}
.zoom{position:fixed;inset:0;background:rgba(20,12,5,.88);display:flex;align-items:center;justify-content:center;z-index:80;cursor:zoom-out}
.zoom img{max-width:96vw;max-height:92vh}
.gnav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;border-radius:10px;background:rgba(255,246,230,.18);color:#fff;font-size:34px;cursor:pointer}
.gnav.l{left:10px} .gnav.r{right:10px}
.gcount{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#f5e6c8;font-size:14px}
.proofs{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:2px dashed var(--line2);border-radius:var(--radius);background:var(--card2);min-height:112px;align-items:flex-start}
.proofs:focus{outline:2px solid var(--gold);outline-offset:1px}
.proofs.drag{border-color:var(--gold);background:#fbefd6}
.pf{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.pf img{width:100%;height:100%;object-fit:cover}
.pf .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(58,45,34,.75);color:#fff;font-size:13px;line-height:22px;cursor:pointer;padding:0}
.pf.new::after{content:"新";position:absolute;left:3px;top:3px;background:var(--gold);color:#fff;font-size:10px;border-radius:4px;padding:0 4px}
.pfadd{width:96px;height:96px;border-radius:8px;border:1px dashed var(--line2);background:#fff;color:var(--muted);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pfadd b{font-size:22px;color:var(--gold-ink);font-weight:400}
.proofbtn{border:0;background:none;color:var(--gold-ink);cursor:pointer;padding:0;font-size:12px;text-decoration:underline}
</style>
</head>
<body>
<header class="top"><div class="in">
  <svg class="coin" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="18" fill="#e9c470" stroke="#fff1c9" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14.5" fill="none" stroke="#b8862f" stroke-width="1.2"/>
    <rect x="15" y="15" width="10" height="10" rx="1" fill="#7a5230" stroke="#b8862f" stroke-width="1.2"/>
  </svg>
  <div><div class="brand">商品紀錄</div><div class="tag">招財進寶・生意興隆</div></div>
  <div class="sp"></div><div id="topact"></div>
</div></header>
<main id="app"></main>
<nav class="tabs hidden" id="tabs">
  <a href="#stats" data-v="stats">統計</a>
  <a href="#home" data-v="home">首頁</a>
  <a href="#new" data-v="new" class="new">＋ 新增記錄</a>
</nav>
<script>
(function(){
'use strict';
const CFG = window.LEDGER_CONFIG || {};
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const twd = v => v == null ? '—' : (v < 0 ? '−' : '') + 'NT$' + Math.round(Math.abs(v)).toLocaleString('zh-TW');
const jpy = v => v == null ? '—' : '¥' + Math.round(v).toLocaleString('ja-JP');
const ymLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16)}));
const STATUS = {stock:'在庫', reserved:'已預訂', sold:'已售出'};
const METHODS = ['賣貨便','好賣+','面交','店到店','宅配／郵寄','蝦皮'];
const SHIP = ['到內湖','日本運送中','國際運送中','台灣運送中','到中山'];
const shipCls = v => v && v.startsWith('到') ? 'arr' : (v ? 'move' : 'none');
const PLATFORMS = ['BNS','台灣煤爐','日本煤爐','Buyee','樂淘'];
const PLACES = ['蝦皮','Facebook 社團','Instagram','Threads','LINE 社群','場販'];
function errMsg(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/schema cache|column .* does not exist|Could not find the .* column/i.test(m)) return m + '（資料表少了新欄位：請到 Supabase SQL Editor 重新執行最新的 schema.sql）';
  if (/relation .* does not exist|Could not find the table/i.test(m)) return m + '（還沒建資料表：請到 SQL Editor 執行 schema.sql）';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return m + '（連不到 Supabase：檢查 config.js 的網址，或專案是否被暫停）';
  if (/Invalid API key|No API key|JWT|apikey/i.test(m)) return m + '（API key 錯誤：config.js 要填 anon / publishable key）';
  if (/row-level security|permission denied|violates row-level/i.test(m)) return m + '（被 RLS 擋下：確認已登入，且 schema.sql 的 policy 有建立）';
  return m;
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- 計算 ---------- */
// 實際購買價：有填用填的；沒填 = 原價 × 匯率
function paid(p){ return p.paid_twd != null ? +p.paid_twd : (p.price_jpy != null && p.rate != null ? Math.round(p.price_jpy * p.rate) : null); }
// 總成本 = 實際購買價 + 運費 + 手續費 + 海關稅 − 折扣
function cost(p){ const a = paid(p); if (a == null) return null; return a + (+p.shipping||0) + (+p.fee||0) + (+p.buy_tax||0) - (+p.discount||0); }
const sold = u => u.status === 'sold';
function soldTotal(p){ return (p.units||[]).reduce((s,u)=> s + (sold(u) ? (+u.sold_price||0) : 0), 0); }
function soldCount(p){ return (p.units||[]).filter(sold).length; }
function expectTotal(p){ return (p.units||[]).reduce((s,u)=> s + (sold(u) ? (+u.sold_price||0) : (+u.list_price||0)), 0); }
// 利潤 = 已賣出 − 總成本
function profit(p){ const c = cost(p); return c == null ? null : soldTotal(p) - c; }
function expectProfit(p){ const c = cost(p); return c == null ? null : expectTotal(p) - c; }
// 分帳：已售出那幾隻，貨款先進帳戶，之後再分
function unsettledCount(p){ return (p.units||[]).filter(u => sold(u) && !u.settled).length; }
// 每隻分攤成本：把「總成本」分給每一隻。每隻都有日幣價 → 照日幣價比例；否則平均。
function alloc(p, units){
  units = units || p.units || []; const c = cost(p);
  if (c == null || !units.length) return units.map(()=>null);
  const all = units.every(u => +u.price_jpy > 0);
  const w = units.map(u => all ? +u.price_jpy : 1); const W = w.reduce((a,b)=>a+b,0);
  return w.map(x => c * x / W);
}
const allocMode = units => units.length && units.every(u=>+u.price_jpy>0) ? '依每隻日幣價比例分攤總成本' : '總成本平均分攤（每隻都填日幣價就會改按比例）';

/* ---------- 圖片 ---------- */
async function loadImg(src){
  return await new Promise((res,rej)=>{ const i=new Image(); if (/^https?:/.test(src)) i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}
async function canvasBlob(c, q){
  const b = await new Promise(r => c.toBlob(r, 'image/webp', q));
  if (b && b.type === 'image/webp') return b;
  return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
async function compress(file, maxSide, q){
  const url = URL.createObjectURL(file);
  try{
    const img = await loadImg(url);
    const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await canvasBlob(c, q);
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

// 從主圖框選一塊當作這一隻的圖片
function cropFrom(src){
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'cropbg';
    bg.innerHTML = `<div class="crophint">在圖上拖曳，框出這一隻</div>
      <div class="cropwrap"><img alt=""><div class="cropsel hidden"></div></div>
      <div class="row"><button class="btn" data-a="no">取消</button><button class="btn goldbtn" data-a="ok" disabled>使用這個範圍</button></div>`;
    document.body.appendChild(bg);
    const img = $('img', bg), sel = $('.cropsel', bg), wrap = $('.cropwrap', bg), ok = $('[data-a=ok]', bg);
    if (/^https?:/.test(src)) img.crossOrigin = 'anonymous';
    img.src = src;
    let r = null, st = null;
    const pt = e => { const b = img.getBoundingClientRect(); return { x: Math.max(0, Math.min(b.width, e.clientX - b.left)), y: Math.max(0, Math.min(b.height, e.clientY - b.top)) }; };
    const show = () => { Object.assign(sel.style, { left:r.x+'px', top:r.y+'px', width:r.w+'px', height:r.h+'px' }); sel.classList.remove('hidden'); };
    wrap.onpointerdown = e => { e.preventDefault(); wrap.setPointerCapture(e.pointerId); st = pt(e); r = { x:st.x, y:st.y, w:0, h:0 }; show(); };
    wrap.onpointermove = e => { if (!st) return; const q = pt(e); r = { x:Math.min(st.x,q.x), y:Math.min(st.y,q.y), w:Math.abs(q.x-st.x), h:Math.abs(q.y-st.y) }; show(); };
    wrap.onpointerup = () => { st = null; ok.disabled = !(r && r.w > 8 && r.h > 8); };
    const done = v => { bg.remove(); resolve(v); };
    $('[data-a=no]', bg).onclick = () => done(null);
    ok.onclick = async () => {
      const k = img.naturalWidth / img.getBoundingClientRect().width;
      const sw = r.w*k, sh = r.h*k, s = Math.min(1, 900 / Math.max(sw, sh));
      const c = document.createElement('canvas'); c.width = Math.round(sw*s); c.height = Math.round(sh*s);
      c.getContext('2d').drawImage(img, r.x*k, r.y*k, sw, sh, 0, 0, c.width, c.height);
      try { done(await canvasBlob(c, .88)); }
      catch(e){ toast('這張圖是外部網址，瀏覽器不允許裁切，請改用上傳'); done(null); }
    };
    img.onerror = () => { toast('主圖載入失敗'); done(null); };
  });
}

/* ---------- 資料層：本機 ---------- */
const LocalStore = {
  mode: 'local', KEY: 'item-ledger-v1',
  _read(){ try { return JSON.parse(localStorage.getItem(this.KEY)) || null; } catch(e){ return null; } },
  _write(d){ try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch(e){ toast('本機空間不足，請刪掉部分圖片或改用 Supabase'); throw e; } },
  async init(){ if (!this._read()) this._write(demoData()); return true; },
  async list(){ return this._read(); },
  async _units(pid, units){
    const out = [];
    for (const [i,u0] of units.entries()) {
      const u = {...u0, purchase_id:pid, sort:i};
      if (u._blob) u.image_data = await blobToDataURL(await compress(u._blob, 360, .72));
      else if (u._clear) u.image_data = null;
      delete u._blob; delete u._clear; delete u._preview; out.push(u);
    }
    return out;
  },
  proofs(p){ return (p.proof_data||[]).map(d => ({ ref:d, url:d })); },
  async save(p, units, imgBlob, proofs){
    p = {...p};
    if (imgBlob) { p.image_data = await blobToDataURL(await compress(imgBlob, 640, .72)); p.image_url = null; }
    if (proofs) { const out = []; for (const x of proofs) out.push(x.blob ? await blobToDataURL(await compress(x.blob, 1100, .8)) : x.ref); p.proof_data = out; }
    p.units = await this._units(p.id, units);
    p.updated_at = new Date().toISOString();
    const d = this._read();
    const i = d.findIndex(x=>x.id===p.id); if (i>=0) d[i] = {...d[i], ...p}; else d.unshift({...p, created_at:p.updated_at});
    this._write(d); return p;
  },
  async saveUnits(pid, units){ const d=this._read(); const p=d.find(x=>x.id===pid); p.units = await this._units(pid, units); this._write(d); },
  async patch(id, obj){ const d=this._read(); Object.assign(d.find(x=>x.id===id), obj); this._write(d); },
  async patchUnits(ids, obj){ const d=this._read(); d.forEach(p => (p.units||[]).forEach(u => { if (ids.includes(u.id)) Object.assign(u, obj); })); this._write(d); },
  async remove(id){ this._write(this._read().filter(x=>x.id!==id)); },
  async imageUrls(list){ const m={}; list.forEach(p=>{ m[p.id] = p.image_data || p.image_url || null; (p.units||[]).forEach(u => { m[u.id] = u.image_data || null; }); }); return m; },
  async clearImage(p){ p.image_data = null; },
  exportAll(){ return this._read(); },
  importAll(d){ this._write(d); }
};

/* ---------- 資料層：Supabase ---------- */
const SupaStore = {
  mode: 'supabase', sb: null, urlCache: {},
  async init(){
    this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
    const { data } = await this.sb.auth.getSession(); return !!data.session;
  },
  async login(email, pw){ const { error } = await this.sb.auth.signInWithPassword({ email, password: pw }); if (error) throw error; },
  async logout(){ await this.sb.auth.signOut(); },
  async list(){
    const { data, error } = await this.sb.from('purchases').select('*, units(*)').order('purchase_date', {ascending:false}).order('created_at', {ascending:false});
    if (error) throw error;
    data.forEach(p => p.units.sort((a,b)=>a.sort-b.sort)); return data;
  },
  async _upload(blob, prefix){
    const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
    const path = `${prefix}-${Date.now().toString(36)}.${ext}`;
    const { error } = await this.sb.storage.from('item-photos').upload(path, blob, { contentType: blob.type });
    if (error) throw error; return path;
  },
  _rm(paths){ paths = paths.filter(Boolean); if (paths.length) this.sb.storage.from('item-photos').remove(paths); },
  proofs(p){ return (p.proof_paths||[]).map(path => ({ ref:path, url: imgs['pf:'+path] || null })); },
  async save(p, units, imgBlob, proofs){
    p = {...p}; delete p.units; delete p.image_data; delete p.proof_data;
    let oldPath = null, dropProofs = [];
    if (proofs) {
      const before = p.proof_paths || [], out = [];
      for (const x of proofs) out.push(x.blob ? await this._upload(await compress(x.blob, 2000, .86), `proofs/${p.id}/${uuid().slice(0,8)}`) : x.ref);
      dropProofs = before.filter(b => !out.includes(b)); p.proof_paths = out;
    }
    if (imgBlob) {
      const path = await this._upload(await compress(imgBlob, 1400, .85), `${p.purchase_date.slice(0,7)}/${p.id}`);
      oldPath = p.image_path; p.image_path = path; p.image_url = null;
    }
    const { error: e1 } = await this.sb.from('purchases').upsert(p); if (e1) throw e1;
    await this.saveUnits(p.id, units);
    this._rm([oldPath, ...dropProofs]);
    return p;
  },
  async saveUnits(pid, units){
    const { data: before } = await this.sb.from('units').select('id,image_path').eq('purchase_id', pid);
    const drop = [];
    const rows = [];
    for (const [i,u] of units.entries()) {
      let image_path = u.image_path || null;
      if (u._blob) { if (image_path) drop.push(image_path); image_path = await this._upload(await compress(u._blob, 900, .85), `units/${pid}/${u.id}`); }
      else if (u._clear) { if (image_path) drop.push(image_path); image_path = null; }
      rows.push({ id:u.id, purchase_id:pid, sort:i, name:u.name||'', image_path, price_jpy:num(u.price_jpy), list_price:num(u.list_price),
        status:u.status||'stock', sold_price:num(u.sold_price), settled: sold(u) ? !!u.settled : false, settled_date: sold(u) && u.settled ? (u.settled_date||null) : null, sold_date:u.sold_date||null,
        sold_place:u.sold_place||null, trade_method:u.trade_method||null, buyer:u.buyer||null });
    }
    const keep = new Set(rows.map(r=>r.id));
    (before||[]).forEach(b => { if (!keep.has(b.id)) drop.push(b.image_path); });
    let q = this.sb.from('units').delete().eq('purchase_id', pid);
    if (keep.size) q = q.not('id', 'in', `(${[...keep].join(',')})`);
    const { error: e0 } = await q; if (e0) throw e0;
    if (rows.length) { const { error } = await this.sb.from('units').upsert(rows); if (error) throw error; }
    this._rm(drop);
  },
  async patch(id, obj){ const { error } = await this.sb.from('purchases').update(obj).eq('id', id); if (error) throw error; },
  async patchUnits(ids, obj){ const { error } = await this.sb.from('units').update(obj).in('id', ids); if (error) throw error; },
  async remove(id){
    const { data } = await this.sb.from('purchases').select('image_path, proof_paths, units(image_path)').eq('id', id).single();
    const { error } = await this.sb.from('purchases').delete().eq('id', id); if (error) throw error;
    if (data) this._rm([data.image_path, ...(data.proof_paths||[]), ...(data.units||[]).map(u=>u.image_path)]);
  },
  async imageUrls(list){
    const m = {}, need = [], now = Date.now();
    const objs = list.flatMap(p => [p, ...(p.units||[]), ...(p.proof_paths||[]).map(path => ({ id:'pf:'+path, image_path:path }))]);
    objs.forEach(o => {
      if (o.image_path) { const c = this.urlCache[o.image_path]; if (c && c.exp > now) m[o.id] = c.url; else need.push(o); }
      else m[o.id] = o.image_url || null;
    });
    for (let i = 0; i < need.length; i += 200) {
      const part = need.slice(i, i+200);
      const { data } = await this.sb.storage.from('item-photos').createSignedUrls(part.map(o=>o.image_path), 3600);
      (data||[]).forEach((r,j) => { if (r.signedUrl) { this.urlCache[part[j].image_path] = { url:r.signedUrl, exp: now + 3300e3 }; m[part[j].id] = r.signedUrl; } });
    }
    return m;
  },
  async clearImage(p){ if (p.image_path) this._rm([p.image_path]); p.image_path = null; }
};

let store = null, items = [], imgs = {};
const ui = { q:'', tag:'', month:'', platform:'', ship:'', range:'12', sort:'date' };

async function reload(){ items = await store.list(); imgs = await store.imageUrls(items); }
function allTags(){ const s = new Map(); items.forEach(p => (p.tags||[]).forEach(t => s.set(t, (s.get(t)||0)+1))); return [...s.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]); }
function platforms(){ const s = new Set(PLATFORMS); items.forEach(p => { if (p.platform) s.add(p.platform); }); return [...s]; }
function suggest(key, presets){ const s = new Set(presets); items.forEach(p => (p.units||[]).forEach(u => { if (u[key]) s.add(u[key]); })); return [...s]; }

/* ---------- 路由 ---------- */
async function route(){
  const h = location.hash.slice(1) || 'home';
  const [view, arg] = h.split('/');
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === (view==='edit'?'new':view)));
  window.scrollTo(0,0);
  if (view === 'stats') renderStats();
  else if (view === 'new') renderForm(null);
  else if (view === 'edit') renderForm(items.find(p=>p.id===arg) || null);
  else renderHome();
}

/* ---------- 首頁 ---------- */
function filtered(){
  const q = ui.q.trim().toLowerCase();
  let list = items.filter(p => {
    if (ui.tag && !(p.tags||[]).includes(ui.tag)) return false;
    if (ui.month && !String(p.purchase_date).startsWith(ui.month)) return false;
    if (ui.platform && (p.platform||'（未填）') !== ui.platform) return false;
    if (ui.ship && (p.ship_status||'未設定') !== ui.ship) return false;
    if (q) { const hay = [p.title, p.note, p.source_url, p.platform, p.ship_status, ...(p.tags||[]), ...(p.units||[]).map(u=>[u.name,u.buyer,u.sold_place,u.trade_method].join(' '))].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  const by = { date: (a,b) => String(b.purchase_date).localeCompare(String(a.purchase_date)),
    profit: (a,b) => (profit(b)??-1e12) - (profit(a)??-1e12), cost: (a,b) => (cost(b)??0) - (cost(a)??0),
    unsold: (a,b) => ((b.units||[]).length - soldCount(b)) - ((a.units||[]).length - soldCount(a)) };
  return list.sort(by[ui.sort] || by.date);
}

// root：容器；getP()：取得目前的 purchase（算分攤）；getMain()：主圖網址（裁切用）
function bindUnits(root, units, redraw, getP, getMain, onChange){
  const refreshAlloc = () => {
    const al = alloc(getP(), units);
    $$('.ucard', root).forEach(card => { const i = +card.dataset.i, u = units[i];
      const a = $('[data-alloc]', card); if (a) a.textContent = al[i]==null ? '—' : twd(al[i]);
      const up = $('[data-uprofit]', card); if (up) up.textContent = al[i]==null||u.sold_price==null ? '—' : twd(u.sold_price-al[i]); });
    onChange && onChange();
  };
  $$('.ucard', root).forEach(card => {
    const i = +card.dataset.i, u = units[i];
    $$('input,select', card).forEach(el => {
      const ev = el.tagName === 'SELECT' ? 'change' : 'input';
      el.addEventListener(el.type === 'checkbox' ? 'change' : ev, () => {
        const k = el.dataset.k;
        if (el.type === 'checkbox') { u[k] = el.checked; if (k === 'settled') { if (el.checked && !u.settled_date) u.settled_date = today(); if (!el.checked) u.settled_date = null; redraw(); } return; }
        u[k] = ['price_jpy','list_price','sold_price'].includes(k) ? num(el.value) : el.value;
        if (k === 'status') {
          if (el.value === 'sold') { if (u.sold_price == null) u.sold_price = u.list_price; if (!u.sold_date) u.sold_date = today(); }
          redraw();
        } else refreshAlloc();
      });
    });
    const box = $('.uimg', card);
    const setBlob = b => { if (!b || !b.type.startsWith('image/')) return; u._blob = b; u._clear = false; if (u._preview) URL.revokeObjectURL(u._preview); u._preview = URL.createObjectURL(b); redraw(); };
    box._setBlob = setBlob;
    box.onclick = () => { const f = document.createElement('input'); f.type='file'; f.accept='image/*'; f.onchange = () => setBlob(f.files[0]); f.click(); };
    box.ondragover = e => { e.preventDefault(); box.classList.add('drag'); };
    box.ondragleave = () => box.classList.remove('drag');
    box.ondrop = e => { e.preventDefault(); box.classList.remove('drag'); setBlob(e.dataTransfer.files[0]); };
    const crop = $('[data-a=crop]', card);
    crop.onclick = async () => { const src = getMain(); if (!src) { toast('這筆還沒有主圖'); return; } const b = await cropFrom(src); if (b) setBlob(b); };
    const rm = $('[data-a=rm]', card);
    if (rm) rm.onclick = () => { u._blob = null; u._preview = null; u._clear = true; redraw(); };
  });
  $$('[data-del]', root).forEach(b => b.onclick = () => { const u = units[+b.dataset.del]; if ((u.name || u.sold_price != null) && !confirm(`刪除「${u.name||'這隻'}」？`)) return; units.splice(+b.dataset.del, 1); redraw(); });
}

// 貼上：焦點在某隻的圖片框 → 給那一隻；否則在表單頁 → 主圖
document.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if (!it) return;
  const box = document.activeElement && document.activeElement.closest && document.activeElement.closest('.uimg');
  if (box && box._setBlob) { e.preventDefault(); box._setBlob(it.getAsFile()); toast('已貼到這一隻'); return; }
  const pz = document.activeElement && document.activeElement.closest && document.activeElement.closest('#proofzone');
  if (pz && window.__proofPaste) { e.preventDefault(); window.__proofPaste([...e.clipboardData.items].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile())); toast('已加入購買證明'); return; }
  if (window.__mainPaste) { e.preventDefault(); window.__mainPaste(it.getAsFile()); toast('已貼上主圖'); }
});

function openUnits(id){
  const p = items.find(x=>x.id===id); if (!p) return;
  let units = (p.units||[]).map(u=>({...u}));
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape' && !$('.cropbg') && !$('.zoom')) close(); };
  document.addEventListener('keydown', onKey);
  const head = () => {
    const st = units.reduce((s,u)=>s+(sold(u)?(+u.sold_price||0):0),0), un = units.reduce((s,u)=>s+(sold(u)&&!u.settled?(+u.sold_price||0):0),0);
    return `${twd(cost(p))} 總成本 · 已賣 ${twd(st)}${un?`（<span class="unset">未分帳 ${twd(un)}</span>）`:''} · 利潤 <b class="${st-(cost(p)||0)>=0?'pos':'neg'}">${twd(st-(cost(p)||0))}</b>`;
  };
  const draw = () => {
    bg.innerHTML = `<div class="modal">
      <div class="mh">${imgs[p.id] ? `<img src="${esc(imgs[p.id])}" id="zoomimg" alt="">` : ''}
        <div class="grow"><div class="mt">${esc(p.title||'(未命名)')}</div>
          <div class="sub">${esc(p.purchase_date)}${p.platform ? ` · ${esc(p.platform)}` : ''}${p.ship_status ? ` · <span class="ship ${shipCls(p.ship_status)}">${esc(p.ship_status)}</span>` : ''}${store.proofs(p).length ? ` · <button class="proofbtn" type="button" id="mproof">購買證明 ${store.proofs(p).length}</button>` : ''}${p.source_url ? ` · <a href="${esc(p.source_url)}" target="_blank" rel="noopener">原始網址</a>`:''}</div>
          <div style="margin-top:4px" id="mhsum">${head()}</div>
          <div class="sub" id="mhmode">${allocMode(units)}</div></div>
        <button class="x" id="close" aria-label="關閉">✕</button></div>
      <div id="uw">${unitsHTML(units, alloc(p, units))}</div>
      <div class="row mfoot" style="justify-content:space-between">
        <button class="btn small" id="addu">＋ 加一隻</button>
        <div class="row"><button class="btn" id="cancel">取消</button><button class="btn primary" id="saveu">儲存</button></div></div>
    </div>`;
    bindUnits($('#uw', bg), units, draw, () => p, () => imgs[p.id], () => { $('#mhsum', bg).innerHTML = head(); $('#mhmode', bg).textContent = allocMode(units); });
    $('#addu', bg).onclick = () => { units.push(newUnit()); draw(); };
    $('#close', bg).onclick = $('#cancel', bg).onclick = close;
    if ($('#zoomimg', bg)) $('#zoomimg', bg).onclick = () => zoom(imgs[p.id]);
    if ($('#mproof', bg)) $('#mproof', bg).onclick = () => gallery(store.proofs(p).map(x=>x.url), 0);
    $('#saveu', bg).onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = '儲存中…';
      try { await store.saveUnits(p.id, units); await reload(); close(); toast('已儲存'); route(); }
      catch(err){ console.error(err); toast('儲存失敗：' + errMsg(err)); e.target.disabled = false; e.target.textContent = '儲存'; }
    };
  };
  bg.onclick = e => { if (e.target === bg) close(); };
  document.body.appendChild(bg); draw();
}
function gallery(urls, i){
  urls = urls.filter(Boolean); if (!urls.length) return;
  const z = document.createElement('div'); z.className = 'zoom';
  const show = () => { z.innerHTML = `<img src="${esc(urls[i])}" alt="">${urls.length>1 ? `<button class="gnav l" aria-label="上一張">‹</button><button class="gnav r" aria-label="下一張">›</button><div class="gcount">${i+1} / ${urls.length}</div>` : ''}`;
    const l = $('.gnav.l', z), r = $('.gnav.r', z);
    if (l) l.onclick = e => { e.stopPropagation(); i = (i-1+urls.length)%urls.length; show(); };
    if (r) r.onclick = e => { e.stopPropagation(); i = (i+1)%urls.length; show(); }; };
  const key = e => { if (e.key==='Escape') close(); else if (e.key==='ArrowLeft' && urls.length>1) { i=(i-1+urls.length)%urls.length; show(); } else if (e.key==='ArrowRight' && urls.length>1) { i=(i+1)%urls.length; show(); } };
  const close = () => { z.remove(); document.removeEventListener('keydown', key); };
  z.onclick = close; document.addEventListener('keydown', key);
  document.body.appendChild(z); show();
}
function zoom(src){ const z=document.createElement('div'); z.className='zoom'; z.innerHTML=`<img src="${esc(src)}" alt="">`; z.onclick=()=>z.remove(); document.body.appendChild(z); }

async function fetchRate(){
  const tries = [
    async () => (await (await fetch('https://api.frankfurter.dev/v1/latest?base=JPY&symbols=TWD')).json()).rates.TWD,
    async () => (await (await fetch('https://open.er-api.com/v6/latest/JPY')).json()).rates.TWD
  ];
  for (const t of tries) { try { const r = await t(); if (r > 0) return Math.round(r*10000)/10000; } catch(e){} }
  return null;
}

  const val = id => $('#'+id).value;

      ['定價合計', twd(units.reduce((s,u)=>s+(+u.list_price||0),0))],
      ['已賣出', twd(soldTotal(tmp))], ['利潤', twd(profit(tmp)), 1], ['全賣完利潤', twd(expectProfit(tmp))]
    ].map(([k,v,h])=>`<div class="${h?'hl':''}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  const drawTags = () => {
    $$('#tagbox .chip').forEach(c=>c.remove());
    tags.forEach((t,i) => { const s=document.createElement('span'); s.className='chip'; s.textContent=t; s.title='點擊移除'; s.onclick=()=>{ tags.splice(i,1); drawTags(); }; $('#tagbox').insertBefore(s, $('#taginput')); });
  };
  const addTag = () => { const v = $('#taginput').value.trim().replace(/^#/, ''); if (v && !tags.includes(v)) tags.push(v); $('#taginput').value=''; drawTags(); };
  $('#taginput').addEventListener('keydown', e => { if (e.isComposing) return; if (e.key==='Enter' || e.key===',' || e.key==='，') { e.preventDefault(); addTag(); } else if (e.key==='Backspace' && !e.target.value && tags.length) { tags.pop(); drawTags(); } });
  $('#taginput').addEventListener('change', addTag);
  drawTags(); drawUnits();
  $$('.card .grid input, .card .grid textarea').forEach(i => i.addEventListener('input', calc));

  // 購買證明
  const drawProofs = () => {
    const z = $('#proofzone');
    z.innerHTML = proofs.map((x,i)=>`<div class="pf ${x.blob?'new':''}" data-i="${i}">${x.url ? `<img src="${esc(x.url)}" alt="">` : ''}<button type="button" class="rm" data-rm="${i}" aria-label="移除">✕</button></div>`).join('')
      + `<button type="button" class="pfadd" id="pfadd"><b>＋</b>加入照片</button>`;
    $$('.pf', z).forEach(el => el.onclick = e => { if (e.target.closest('.rm')) return; gallery(proofs.map(x=>x.url), +el.dataset.i); });
    $$('[data-rm]', z).forEach(b => b.onclick = () => { if (!confirm('移除這張購買證明？（儲存後生效）')) return; proofs.splice(+b.dataset.rm, 1); drawProofs(); });
    $('#pfadd').onclick = () => { const f=document.createElement('input'); f.type='file'; f.accept='image/*'; f.multiple=true; f.onchange=()=>addProofs([...f.files]); f.click(); };
  };
  const addProofs = files => { files.filter(f=>f && f.type.startsWith('image/')).forEach(f => proofs.push({ blob:f, url:URL.createObjectURL(f) })); drawProofs(); };
  window.__proofPaste = addProofs;
  const pz = $('#proofzone');
  pz.ondragover = e => { e.preventDefault(); pz.classList.add('drag'); };
  pz.ondragleave = () => pz.classList.remove('drag');
  pz.ondrop = e => { e.preventDefault(); pz.classList.remove('drag'); addProofs([...e.dataTransfer.files]); };
  drawProofs();

  // 主圖
  const setImg = (blob) => { if (!blob || !blob.type.startsWith('image/')) return; imgBlob = blob; mainSrc = URL.createObjectURL(blob);
    $('#imgbox').innerHTML = `<img src="${mainSrc}" alt=""><div>點擊更換主圖</div>`; $('#imgurl').value = ''; };
  window.__mainPaste = setImg;
  $('#imgbox').onclick = () => $('#file').click();
  $('#file').onchange = e => setImg(e.target.files[0]);
  $('#imgbox').ondragover = e => { e.preventDefault(); e.currentTarget.classList.add('drag'); };
  $('#imgbox').ondragleave = e => e.currentTarget.classList.remove('drag');
  $('#imgbox').ondrop = e => { e.preventDefault(); e.currentTarget.classList.remove('drag'); setImg(e.dataTransfer.files[0]); };
  $('#imgurl').onchange = () => { const u = $('#imgurl').value.trim(); if (u) { imgBlob = null; mainSrc = u; $('#imgbox').innerHTML = `<img src="${esc(u)}" alt=""><div>使用外部網址</div>`; } };
  if ($('#rmimg')) $('#rmimg').onclick = () => { if (!confirm('移除這筆的主圖？')) return; p._clearImage = true; p.image_url = null; mainSrc = null; imgBlob = null; $('#imgurl').value=''; $('#imgbox').innerHTML='<div>已移除，儲存後生效</div>'; };

  $('#getrate').onclick = async (e) => { e.target.disabled = true; e.target.textContent = '…'; const r = await fetchRate(); e.target.disabled = false; e.target.textContent = '即時';
    if (r) { $('#rate').value = r; calc(); toast('匯率 ' + r); } else toast('抓不到匯率，請手動輸入'); };
  $('#addu').onclick = () => { units.push(newUnit()); drawUnits(); };
  $('#addn').onclick = () => { const n = parseInt(prompt('要加幾隻？', '3')); if (n > 0 && n <= 50) { for (let i=0;i<n;i++) units.push(newUnit()); drawUnits(); } };
  $('#cancel').onclick = () => history.length > 1 ? history.back() : (location.hash = 'home');
  if ($('#del')) $('#del').onclick = async () => { if (!confirm('確定刪除這筆紀錄和所有「每一隻」？')) return; try { await store.remove(p.id); await reload(); toast('已刪除'); location.hash='home'; } catch(err){ toast('刪除失敗：'+errMsg(err)); } };
  $('#save').onclick = async (e) => {
    read(); if ($('#taginput').value.trim()) { addTag(); read(); }
    if (!p.title) { toast('請填商品名稱'); $('#title').focus(); return; }
    e.target.disabled = true; e.target.textContent = '儲存中…';
    try {
      if (p._clearImage) await store.clearImage(p); delete p._clearImage;
      if (p.rate) localStorage.setItem('ledger-last-rate', p.rate);
      if (p.platform) localStorage.setItem('ledger-last-platform', p.platform);
      const clean = units.filter(u => u.name || u.list_price != null || u.price_jpy != null || u.status !== 'stock' || u._blob || imgs[u.id]);
      await store.save(p, clean, imgBlob, proofs);
      await reload(); toast('已儲存');
      if (isNew) Object.assign(ui, { q:'', tag:'', month:'', platform:'', ship:'' }); // 新增後清掉篩選，才看得到剛建的那筆
      location.hash = 'home';
    } catch(err){ console.error(err); toast('儲存失敗：' + errMsg(err)); e.target.disabled = false; e.target.textContent = '儲存'; }
  };
}

/* ---------- 統計 ---------- */
function monthKey(d){ return String(d||'').slice(0,7); }
function monthsBetween(a, b){ const out=[]; let [y,m]=a.split('-').map(Number); const [Y,M]=b.split('-').map(Number); while (y<Y || (y===Y && m<=M)) { out.push(`${y}-${String(m).padStart(2,'0')}`); m++; if (m>12){m=1;y++;} } return out; }
const soldMonth = (u,p) => monthKey(u.sold_date || p.purchase_date);

function period(){
  const now = monthKey(today());
  const all = items.flatMap(p => [monthKey(p.purchase_date), ...(p.units||[]).filter(sold).map(u=>soldMonth(u,p))]).filter(Boolean).sort();
  if (ui.range === 'all') return all[0] || now;
  if (ui.range === 'year') return now.slice(0,4) + '-01';
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - (+ui.range - 1)); return ymLocal(d);
}
function monthly(start){
  const keys = monthsBetween(start, monthKey(today()));
  const m = Object.fromEntries(keys.map(k => [k, {k, cost:0, sales:0, n:0, sold:0}]));
  items.forEach(p => {
    const k = monthKey(p.purchase_date); if (m[k]) { m[k].cost += cost(p)||0; m[k].n++; }
    (p.units||[]).filter(sold).forEach(u => { const r = m[soldMonth(u,p)]; if (r) { r.sales += +u.sold_price||0; r.sold++; } });
  });
  return keys.map(k=>m[k]);
}
function tagStats(start){
  const t = new Map();
  items.filter(p => monthKey(p.purchase_date) >= start).forEach(p => {
    const tg = (p.tags && p.tags.length) ? p.tags : ['（無標籤）'];
    tg.forEach(name => {
      const r = t.get(name) || { name, n:0, units:0, sold:0, cost:0, sales:0, expect:0 };
      r.n++; r.units += (p.units||[]).length; r.sold += soldCount(p); r.cost += cost(p)||0; r.sales += soldTotal(p); r.expect += expectTotal(p);
      t.set(name, r);
    });
  });
  return [...t.values()].sort((a,b)=>b.cost-a.cost);
}
// 購買平台：依購買日期篩選期間
function platformStats(start){
  const t = new Map();
  items.filter(p => monthKey(p.purchase_date) >= start).forEach(p => {
    const name = p.platform || '（未填）';
    const r = t.get(name) || { name, n:0, units:0, jpy:0, paid:0, extra:0, cost:0, sales:0 };
    const a = paid(p) || 0;
    r.n++; r.units += (p.units||[]).length; r.jpy += +p.price_jpy||0; r.paid += a;
    r.extra += (+p.shipping||0) + (+p.fee||0) + (+p.buy_tax||0) - (+p.discount||0);
    r.cost += cost(p)||0; r.sales += soldTotal(p); t.set(name, r);
  });
  return [...t.values()].sort((a,b)=>b.cost-a.cost);
}
// 售出位置／交易方式：依售出月份篩選期間；利潤用分攤成本算
function channelStats(start, key){
  const t = new Map();
  items.forEach(p => { const al = alloc(p); (p.units||[]).forEach((u,i) => {
    if (!sold(u) || soldMonth(u,p) < start) return;
    const name = u[key] || '（未填）';
    const r = t.get(name) || { name, n:0, sales:0, cost:0 };
    r.n++; r.sales += +u.sold_price||0; r.cost += al[i]||0; t.set(name, r);
  }); });
  return [...t.values()].sort((a,b)=>b.sales-a.sales);
}
function channelTable(rows, title){
  const max = Math.max(1, ...rows.map(r=>r.sales));
  return `<div class="viz"><h3>${title}</h3><div class="tablewrap"><table class="plain"><thead><tr><th>${title}</th><th>隻數</th><th style="width:26%"></th><th>賣出</th><th>利潤</th></tr></thead>
    <tbody>${rows.length ? rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.n}</td><td><div class="bar jade" style="width:${(r.sales/max*100).toFixed(1)}%"></div></td>
      <td>${twd(r.sales)}</td><td class="${r.sales-r.cost>=0?'pos':'neg'}">${twd(r.sales-r.cost)}</td></tr>`).join('') : '<tr><td colspan="5" class="sub">這段期間沒有售出</td></tr>'}</tbody></table></div></div>`;
}

function settleRows(){
  const out = [];
  items.forEach(p => { const al = alloc(p); (p.units||[]).forEach((u,i) => { if (sold(u)) out.push({ p, u, alloc: al[i] }); }); });
  return out;
}
function settleHTML(start){
  const rows = settleRows();
  const un = rows.filter(r => !r.u.settled).sort((a,b)=>String(a.u.sold_date||a.p.purchase_date).localeCompare(String(b.u.sold_date||b.p.purchase_date)));
  const done = rows.filter(r => r.u.settled && monthKey(r.u.settled_date || r.u.sold_date || r.p.purchase_date) >= start);
  const sum = (a,f) => a.reduce((s,r)=>s+f(r),0);
  const unAmt = sum(un, r=>+r.u.sold_price||0), unPf = sum(un, r=>(+r.u.sold_price||0)-(r.alloc||0));
  const dnAmt = sum(done, r=>+r.u.sold_price||0), dnPf = sum(done, r=>(+r.u.sold_price||0)-(r.alloc||0));
  return `<div class="settlebox">
      <div class="tile gold"><div class="k">未分帳貨款（${un.length} 隻）</div><div class="v unset">${twd(unAmt)}</div><div class="k">其中利潤 ${twd(unPf)}</div></div>
      <div class="tile"><div class="k">期間已分帳貨款（${done.length} 隻）</div><div class="v">${twd(dnAmt)}</div><div class="k">其中利潤 ${twd(dnPf)}</div></div>
    </div>
    <div class="viz tablewrap">${un.length ? `<div class="row" style="justify-content:space-between;margin-bottom:6px"><b style="font-size:14px">未分帳明細</b>
        <span class="row"><span class="sub" id="selsum"></span><button class="btn small goldbtn" id="dosettle" disabled>標記為已分帳</button></span></div>
      <table class="plain" style="min-width:680px"><thead><tr><th class="ck"><input type="checkbox" id="ckall" title="全選"></th><th style="text-align:left">售出日</th><th style="text-align:left">商品</th><th style="text-align:left">這隻</th><th style="text-align:left">售出位置</th><th style="text-align:left">買家</th><th>賣出價</th><th>分攤成本</th><th>利潤</th></tr></thead>
      <tbody>${un.map(r=>`<tr><td class="ck"><input type="checkbox" class="ck1" value="${r.u.id}" data-amt="${+r.u.sold_price||0}" data-pf="${(+r.u.sold_price||0)-(r.alloc||0)}"></td>
        <td style="text-align:left">${esc(r.u.sold_date||'—')}</td><td style="text-align:left;white-space:normal;max-width:220px">${esc(r.p.title)}</td><td style="text-align:left">${esc(r.u.name||'—')}</td>
        <td style="text-align:left">${esc(r.u.sold_place||'—')}</td><td style="text-align:left">${esc(r.u.buyer||'—')}</td>
        <td>${twd(r.u.sold_price)}</td><td>${twd(r.alloc)}</td><td class="${(+r.u.sold_price||0)-(r.alloc||0)>=0?'pos':'neg'}">${twd((+r.u.sold_price||0)-(r.alloc||0))}</td></tr>`).join('')}</tbody></table>`
      : '<div class="sub" style="padding:6px">全部都分帳完了 👍</div>'}</div>`;
}
function bindSettle(){
  const btn = $('#dosettle'); if (!btn) return;
  const upd = () => { const ck = $$('.ck1:checked'); btn.disabled = !ck.length;
    $('#selsum').textContent = ck.length ? `已選 ${ck.length} 隻・貨款 ${twd(ck.reduce((s,c)=>s+ +c.dataset.amt,0))}・利潤 ${twd(ck.reduce((s,c)=>s+ +c.dataset.pf,0))}` : ''; };
  $$('.ck1').forEach(c => c.onchange = upd);
  $('#ckall').onchange = e => { $$('.ck1').forEach(c => c.checked = e.target.checked); upd(); };
  btn.onclick = async () => {
    const ids = $$('.ck1:checked').map(c => c.value);
    const d = prompt(`把 ${ids.length} 隻標記為已分帳。分帳日期：`, today()); if (d === null) return;
    btn.disabled = true;
    try { await store.patchUnits(ids, { settled: true, settled_date: d || today() }); await reload(); toast('已標記分帳'); renderStats(); }
    catch(err){ toast('更新失敗：' + errMsg(err)); btn.disabled = false; }
  };
}
function renderStats(){
  const start = period();
  const rows = monthly(start), tags = tagStats(start);
  const tc = rows.reduce((s,r)=>s+r.cost,0), ts = rows.reduce((s,r)=>s+r.sales,0);
  const stock = items.reduce((s,p)=>s+(p.units||[]).filter(u=>!sold(u)).length,0);
  const stockVal = items.reduce((s,p)=>{ const al=alloc(p); return s+(p.units||[]).reduce((a,u,i)=>a+(!sold(u)?(al[i]||0):0),0); },0);
  const maxTag = Math.max(1, ...tags.map(t=>t.cost));
  $('#app').innerHTML = `
    <div class="row" style="justify-content:space-between"><h1>統計</h1>
      <div class="seg" id="range">${[['6','近 6 月'],['12','近 12 月'],['year','今年'],['all','全部']].map(([k,v])=>`<button data-k="${k}" class="${ui.range===k?'on':''}">${v}</button>`).join('')}</div></div>
    <div class="summary">
      <div class="tile"><div class="k">期間總成本</div><div class="v">${twd(tc)}</div></div>
      <div class="tile"><div class="k">期間賣出</div><div class="v">${twd(ts)}</div></div>
      <div class="tile gold"><div class="k">期間淨額</div><div class="v ${ts-tc>=0?'pos':'neg'}">${twd(ts-tc)}</div></div>
      <div class="tile"><div class="k">目前庫存（全部）</div><div class="v">${stock} 隻</div><div class="k">分攤成本約 ${twd(stockVal)}</div></div>
    </div>
    <h2>分帳</h2>
    <div class="sub" style="margin-bottom:8px">貨款先進你的帳戶，分帳後再勾「已分帳」。未分帳是目前累積的總額（不受上方期間影響）；已分帳依分帳日期算在期間內。利潤 = 賣出價 − 該隻分攤成本，給你對照要分的金額。</div>
    ${settleHTML(start)}

    <h2>每月成本統計</h2>
    <div class="sub" style="margin-bottom:8px">成本（含海關稅）算在購買月份；賣出算在售出日期的月份（沒填售出日就算購買月份）。淨額 = 賣出 − 成本。</div>
    <div class="viz" id="viz">
      <div class="legend"><span><i style="background:var(--series-1)"></i>成本</span><span><i style="background:var(--series-2)"></i>賣出</span></div>
      <div id="chart"></div>
    </div>
    <details style="margin-top:8px"><summary class="sub" style="cursor:pointer">表格</summary>
      <div class="viz tablewrap" style="margin-top:6px"><table class="plain"><thead><tr><th>月份</th><th>購買筆數</th><th>成本</th><th>賣出隻數</th><th>賣出</th><th>淨額</th></tr></thead>
      <tbody>${rows.slice().reverse().map(r=>`<tr class="click" data-m="${r.k}"><td>${r.k}</td><td>${r.n}</td><td>${twd(r.cost)}</td><td>${r.sold}</td><td>${twd(r.sales)}</td><td class="${r.sales-r.cost>=0?'pos':'neg'}">${twd(r.sales-r.cost)}</td></tr>`).join('')}</tbody></table></div></details>

    <h2>標籤統計</h2>
    <div class="sub" style="margin-bottom:8px">依購買日期篩選期間。一筆有多個標籤時，會分別計入每個標籤。點一列可在首頁篩選。</div>
    <div class="viz tablewrap"><table class="plain" style="min-width:680px"><thead><tr><th>標籤</th><th>筆數</th><th>售出 / 隻數</th><th style="width:20%"></th><th>成本</th><th>已賣出</th><th>利潤</th><th>全賣完利潤</th></tr></thead>
      <tbody>${tags.length ? tags.map(t=>`<tr class="click" data-tag="${esc(t.name)}"><td>${esc(t.name)}</td><td>${t.n}</td><td>${t.sold} / ${t.units}</td>
        <td><div class="bar" style="width:${(t.cost/maxTag*100).toFixed(1)}%"></div></td><td>${twd(t.cost)}</td><td>${twd(t.sales)}</td>
        <td class="${t.sales-t.cost>=0?'pos':'neg'}">${twd(t.sales-t.cost)}</td><td>${twd(t.expect-t.cost)}</td></tr>`).join('') : '<tr><td colspan="8" class="sub">這段期間沒有資料</td></tr>'}</tbody></table></div>

    <h2>購買平台</h2>
    <div class="sub" style="margin-bottom:8px">依購買日期篩選期間。額外費用 = 運費 + 手續費 + 海關稅 − 折扣；費用比例 = 額外費用 ÷ 實際購買價，可以比較哪個平台買起來比較划算。點一列可在首頁篩選。</div>
    <div class="viz tablewrap">${(() => { const ps = platformStats(start); const mx = Math.max(1, ...ps.map(r=>r.cost)); return `<table class="plain" style="min-width:720px"><thead><tr><th>平台</th><th>筆數</th><th>隻數</th><th style="width:16%"></th><th>總成本</th><th>實際購買價</th><th>額外費用</th><th>費用比例</th><th>已賣出</th><th>利潤</th></tr></thead>
      <tbody>${ps.length ? ps.map(r=>`<tr class="click" data-plat="${esc(r.name)}"><td>${esc(r.name)}</td><td>${r.n}</td><td>${r.units}</td><td><div class="bar" style="width:${(r.cost/mx*100).toFixed(1)}%"></div></td>
        <td>${twd(r.cost)}</td><td>${twd(r.paid)}</td><td>${twd(r.extra)}</td><td>${r.paid ? (r.extra/r.paid*100).toFixed(1)+'%' : '—'}</td><td>${twd(r.sales)}</td>
        <td class="${r.sales-r.cost>=0?'pos':'neg'}">${twd(r.sales-r.cost)}</td></tr>`).join('') : '<tr><td colspan="10" class="sub">這段期間沒有資料</td></tr>'}</tbody></table>`; })()}</div>

    <h2>售出通路</h2>
    <div class="sub" style="margin-bottom:8px">依售出日期篩選期間。利潤 = 賣出 − 該隻的分攤成本。</div>
    <div class="two">${channelTable(channelStats(start,'sold_place'),'售出位置')}${channelTable(channelStats(start,'trade_method'),'交易方式')}</div>`;
  $$('#range button').forEach(b => b.onclick = () => { ui.range = b.dataset.k; renderStats(); });
  $$('tr[data-tag]').forEach(tr => tr.onclick = () => { ui.tag = tr.dataset.tag === '（無標籤）' ? '' : tr.dataset.tag; ui.month=''; location.hash='home'; });
  $$('tr[data-m]').forEach(tr => tr.onclick = () => { ui.month = tr.dataset.m; ui.tag=''; ui.platform=''; location.hash='home'; });
  $$('tr[data-plat]').forEach(tr => tr.onclick = () => { ui.platform = tr.dataset.plat; ui.tag=''; ui.month=''; location.hash='home'; });
  bindSettle();
  drawChart(rows);
  window.onresize = () => { if ((location.hash||'').startsWith('#stats')) drawChart(rows); };
}

function niceMax(v){ if (v<=0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if (m*p >= v) return m*p; return 10*p; }
function drawChart(rows){
  const host = $('#chart'); if (!host) return;
  const W = Math.max(320, host.clientWidth), H = 260, L = 56, R = 8, T = 10, B = 28;
  const max = niceMax(Math.max(...rows.map(r=>Math.max(r.cost, r.sales)), 0));
  const iw = W-L-R, ih = H-T-B, n = rows.length, band = iw / n;
  const bw = Math.max(3, Math.min(22, (band - 8) / 2));
  const y = v => T + ih - v/max*ih;
  const ticks = [0, .25, .5, .75, 1].map(f => f*max);
  const fmtK = v => v >= 10000 ? (v/10000).toLocaleString('zh-TW',{maximumFractionDigits:1})+'萬' : v.toLocaleString('zh-TW');
  const every = Math.ceil(n / Math.floor(iw/52));
  const bar = (x, v, color) => { if (v<=0) return ''; const yt = y(v), yb = T+ih, h = yb-yt, r = Math.min(4, bw/2, h);
    return `<path d="M${x},${yb} V${yt+r} Q${x},${yt} ${x+r},${yt} H${x+bw-r} Q${x+bw},${yt} ${x+bw},${yt+r} V${yb} Z" fill="${color}"/>`; };
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="每月成本與賣出長條圖" style="display:block;font-size:11px">`;
  ticks.forEach(t => s += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${t?'#ece2d2':'#cdbb9d'}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" fill="#9a8875">${fmtK(t)}</text>`);
  rows.forEach((r,i) => {
    const cx = L + band*i + band/2;
    s += bar(cx - bw - 1, r.cost, 'var(--series-1)') + bar(cx + 1, r.sales, 'var(--series-2)');
    if (i % every === 0 || i === n-1) s += `<text x="${cx}" y="${H-8}" text-anchor="middle" fill="#6b5847">${r.k.slice(2).replace('-','/')}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${L+band*i}" y="${T}" width="${band}" height="${ih}" fill="transparent"/>`;
  });
  s += '</svg>';
  host.innerHTML = s;
  const viz = $('#viz'); let tip = null;
  $$('.hit', host).forEach(h => {
    h.onmouseenter = h.ontouchstart = () => {
      const r = rows[+h.dataset.i]; tip && tip.remove(); tip = document.createElement('div'); tip.className = 'tip';
      tip.innerHTML = `<b>${r.k}</b><br>成本 ${twd(r.cost)}（${r.n} 筆）<br>賣出 ${twd(r.sales)}（${r.sold} 隻）<br>淨額 ${twd(r.sales-r.cost)}`;
      const hb = h.getBoundingClientRect(), vb = viz.getBoundingClientRect();
      tip.style.left = Math.min(vb.width-80, Math.max(80, hb.left - vb.left + hb.width/2)) + 'px';
      tip.style.top = (y(Math.max(r.cost, r.sales)) + (host.getBoundingClientRect().top - vb.top) - 6) + 'px';
      viz.appendChild(tip); h.setAttribute('fill','rgba(168,116,31,.07)');
    };
    h.onmouseleave = () => { tip && tip.remove(); tip = null; h.setAttribute('fill','transparent'); };
  });
}

/* ---------- 登入 ---------- */
function renderLogin(){
  $('#tabs').classList.add('hidden');
  $('#app').innerHTML = `<div class="card login"><h1>登入</h1>
    <label class="f">Email<input id="em" type="email" autocomplete="username"></label><br>
    <label class="f">密碼<input id="pw" type="password" autocomplete="current-password"></label><br>
    <button class="btn primary" id="go" style="width:100%">登入</button><div class="sub" id="err" style="margin-top:8px"></div>
    <div class="sub" style="margin-top:10px">連線到：${esc(CFG.supabaseUrl)}</div></div>`;
  const go = async () => { $('#go').disabled = true; try { await store.login($('#em').value.trim(), $('#pw').value); await start(); }
    catch(e){ let m = errMsg(e);
      if (/Invalid login credentials/i.test(m)) m = '帳號或密碼錯誤。帳號要在 Supabase → Authentication → Users 建立，建立時要勾 Auto Confirm User。';
      else if (/Email not confirmed/i.test(m)) m = '這個帳號還沒確認。到 Supabase → Authentication → Users 點該帳號 → Confirm user。';
      $('#err').innerHTML = '<span class="unset">登入失敗：</span>' + esc(m); $('#go').disabled = false; } };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key==='Enter') go(); };
}

async function start(){
  try { await reload(); } catch(e){ console.error(e); $('#app').innerHTML = `<div class="diag"><b>讀取資料失敗</b><br>${esc(errMsg(e))}</div>`; return; }
  $('#tabs').classList.remove('hidden');
  if (store.mode === 'supabase') { $('#topact').innerHTML = '<button class="btn small" id="logout">登出</button>'; $('#logout').onclick = async () => { await store.logout(); location.reload(); }; }
  window.onhashchange = () => { window.__mainPaste = null; window.__proofPaste = null; route(); };
  route();
}

// 檢查 config.js，有問題就說清楚原因
function checkConfig(){
  if (!window.LEDGER_CONFIG) return '讀不到 <code>config.js</code>：確認它和 index.html 放在同一層，而且有 push 上去。';
  let url = (CFG.supabaseUrl || '').trim(), key = (CFG.supabaseAnonKey || '').trim();
  if (!url && !key) return null;  // 刻意用本機模式
  if (!url || !key) return '<code>config.js</code> 只填了網址或 key 其中一個，兩個都要填。';
  url = url.replace(/\/+$/, '').replace(/\/(rest|auth)\/v1.*$/, '');
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)) return `網址格式不對：<code>${esc(url)}</code>。應該長得像 <code>https://abcdefgh.supabase.co</code>（Project Settings → Data API 的 Project URL）。`;
  if (/^sb_secret_/.test(key)) return '你填的是 <b>secret key</b>，這把不能放在網頁上！請到 Supabase 停用它、換一把新的，config.js 改填 <b>publishable key</b>（sb_publishable_ 開頭）或 anon key。';
  if (/^eyJ/.test(key)) { try { const role = JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role;
      if (role === 'service_role') return '你填的是 <b>service_role key</b>，這把不能放在網頁上！請到 Supabase 重新產生 JWT secret，config.js 改填 anon key。'; } catch(e){ return 'API key 格式不對（可能複製時少了一段）。'; } }
  else if (!/^sb_publishable_/.test(key)) return 'API key 格式不對：應該是 <code>sb_publishable_</code> 開頭，或 <code>eyJ</code> 開頭的 anon key。';
  if (!window.supabase) return 'Supabase 程式庫沒有載入（CDN 被擋或網路問題）。換個網路或關掉擋廣告外掛再試。';
  CFG.supabaseUrl = url; CFG.supabaseAnonKey = key;
  return true;
}

(async function boot(){
  const c = checkConfig();
  const useSupa = c === true;
  if (typeof c === 'string') window.__cfgProblem = c;
  store = useSupa ? SupaStore : LocalStore;
  let ok;
  try { ok = await store.init(); }
  catch(e){ window.__cfgProblem = '初始化 Supabase 失敗：' + esc(errMsg(e)); store = LocalStore; ok = await store.init(); }
  if (!ok) renderLogin(); else start();
})();
})();
</script>
